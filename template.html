<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab List</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#202124;--rail:#18191B;--panel:#2A2B2F;--panel2:#35373C;--panel3:#40424A;--line:#43454C;
  --ink:#ECEDEF;--muted:#9C9EA6;--dim:#74767E;
  --over:#3DB46D;--overbg:#2F8F55;--under:#E0524A;--avg:#5BC0F8;--sky:#5BC0F8;--sky2:#9AD8FF;--skybg:rgba(91,192,248,.14);--amber:#E3B341;--silver:#C9CDD5;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#202124;--panel:#2A2B2F;--ink:#ECEDEF}}
:root[data-theme="dark"]{--bg:#202124;--panel:#2A2B2F;--ink:#ECEDEF}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--silver);outline-offset:2px}
.shell{display:grid;grid-template-columns:84px 1fr;min-height:100%}
/* rail */
.rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:none}
.rail .menu{height:64px;display:grid;place-items:center;border-bottom:1px solid var(--line);width:100%;font-family:var(--cond);font-weight:700;font-size:18px;line-height:1;text-align:center;color:var(--silver)}
.rail .lbl{font-size:11px;color:var(--dim);padding:10px 0 4px}
.rail button.rp{background:none;border:0;border-bottom:1px solid var(--line);width:100%;padding:12px 0;display:grid;place-items:center;gap:4px}
.rail button.rp span{font-size:11px;color:var(--muted);max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rail button.rp[aria-current="true"]{background:var(--panel)}
.rail button.rp[aria-current="true"] .av{box-shadow:0 0 0 2px var(--silver)}
/* avatar */
.av{position:relative;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--cond);font-weight:700;color:#fff;overflow:visible;background:var(--panel3)}
.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;object-position:top}
.av .ini{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center}
.av .tb{position:absolute;right:-2px;white-space:nowrap;bottom:-3px;font-size:9px;font-family:var(--body);font-weight:700;background:var(--rail);border:1px solid var(--line);border-radius:5px;padding:0 3px;line-height:14px;color:var(--ink)}
/* main */
.main{min-width:0;padding:14px 18px 60px}
.topbar{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;min-height:76px;padding:0 16px;flex-wrap:wrap}
.iconbtn{background:none;border:0;width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--ink);font-size:20px}
.iconbtn:hover{background:var(--panel2)}
.pname{font-size:24px;font-weight:600;white-space:nowrap}
.ppos{color:var(--avg);font-weight:600;margin-left:8px;font-size:15px}
.hstats{display:flex;margin-left:auto;align-self:stretch}
.hstats div{min-width:150px;padding:12px 18px;border-left:1px solid var(--line);text-align:center;display:flex;flex-direction:column;justify-content:center}
.hstats small{font-family:var(--cond);font-size:15px;color:var(--muted);font-weight:600;letter-spacing:.4px}
.hstats b{font-size:26px;font-weight:600;color:var(--avg)}
.hstats b.g{color:var(--over)}
.search{position:relative;width:260px}
.search input{width:100%;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);font-size:15px}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel2);border:1px solid var(--line);border-radius:10px;z-index:20;max-height:360px;overflow-y:auto;display:none;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.sugg button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:8px 12px;text-align:left}
.sugg button:hover,.sugg button.on{background:var(--panel3)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}.hstats div{min-width:110px;padding:10px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
/* prop tabs */
.ptabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);padding:0 8px;scrollbar-width:thin}
.ptabs button{background:none;border:0;border-bottom:2px solid transparent;padding:14px 10px 12px;display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap;font-weight:500}
.ptabs button[aria-selected="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--avg)}
.badge{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 6px;border-radius:4px;color:#fff;background:var(--overbg)}
.badge.mid{background:#6E6A4E}.badge.lo{background:#9C3A34}
.propbar{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;flex-wrap:wrap}
.ou{font-family:var(--cond);font-weight:700;font-size:20px;letter-spacing:1px;padding:4px 12px;border-radius:6px;border:1px solid var(--over);background:rgba(61,180,109,.18);color:var(--ink)}
.ou.under{border-color:var(--under);background:rgba(224,82,74,.18)}
.ptitle{font-size:22px;font-weight:600}
.linebox{margin-left:auto;display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel2)}
.linebox span{font-family:var(--mono);font-size:12px;color:var(--muted);padding:0 4px 0 12px}
.linebox button{border:0;background:none;width:34px;height:38px;font-size:18px}
.linebox button:hover{background:var(--panel3)}
.linebox input{width:62px;border:0;background:none;text-align:center;font-family:var(--mono);font-size:16px;font-weight:700;height:38px}
.ctx{display:flex;gap:0;margin:6px 16px 0;border:1px solid var(--line);border-radius:6px;width:max-content;max-width:calc(100% - 32px);overflow:hidden;flex-wrap:wrap}
.ctx div{padding:6px 12px;border-right:1px solid var(--line);font-weight:600;font-size:14px;white-space:nowrap}
.ctx div:last-child{border-right:0}
.ctx .m{color:var(--muted);font-weight:500}
.chart{padding:6px 8px 0}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;padding:8px 10px 6px}
.tile{border:2px solid transparent;border-radius:8px;background:none;padding:0;text-align:center;overflow:hidden}
.tile .h{font-family:var(--cond);font-weight:600;font-size:15px;padding:4px 0;color:var(--ink)}
.tile .b{padding:6px 2px;font-weight:600;line-height:1.25;border-radius:6px;margin:0 2px 2px}
.tile .b.hi{background:var(--overbg)}.tile .b.mid{background:#55533F}.tile .b.lo{background:#8E3530}.tile .b.na{background:var(--panel2);color:var(--muted)}
.tile[aria-pressed="true"]{border-color:var(--silver)}
@media (max-width:560px){.tiles{grid-template-columns:repeat(3,1fr)}}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px 16px;align-items:center}
select{padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel2)}
.fl{font-family:var(--cond);font-weight:600;color:var(--muted);font-size:15px;margin-right:2px}
/* right tabs */
.rtabs{display:flex;border-bottom:1px solid var(--line)}
.rtabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:14px 8px 12px;color:var(--muted);font-size:16px;font-weight:500}
.rtabs button[aria-selected="true"]{color:var(--avg);border-bottom-color:var(--avg);font-weight:600}
.rbody{padding:14px 16px 16px}
.dhead{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dhead h2{font-size:21px;margin:0;font-weight:700}
.mtag{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.5px;border:1px solid var(--line);border-radius:4px;padding:2px 7px;color:var(--silver);margin-top:3px}
.comp{font-family:var(--mono);font-size:12px;color:var(--amber);margin-top:4px}
.comp span{color:var(--muted)}
.chiprow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:7px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--panel3);border-color:var(--silver)}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
@media (max-width:560px){.cards{grid-template-columns:1fr}}
.card{border:1px solid #6A5A2A;background:rgba(227,179,65,.06);border-radius:8px;padding:10px 12px}
.card .k{font-family:var(--mono);font-size:11px;letter-spacing:.8px;color:var(--amber)}
.card.str .k{color:var(--under)}
.card .v{font-size:17px;font-weight:700;margin:2px 0}
.card .v em{font-style:normal;font-family:var(--mono);color:var(--amber)}
.card .s{font-size:13px;color:var(--muted)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.dtable{margin-top:12px;border:1px solid var(--line);border-radius:8px;padding:6px 14px}
.dth,.dtr{display:grid;grid-template-columns:96px 64px minmax(80px,1fr) 128px;gap:12px;align-items:center}
.dth{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.5px;padding:6px 0}
.dtr{padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.dtr .n{font-weight:600;letter-spacing:.3px}
.dtr .val{font-family:var(--mono);font-weight:700;text-align:right}
.dtr .rk{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
.dtr .rk b{margin:0 3px}
.track{position:relative;height:8px;background:var(--panel2);border-radius:4px}
.track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--dim)}
.track i{position:absolute;top:0;height:8px;border-radius:4px}
.dtr.sel{background:var(--panel2);margin:0 -14px;padding:10px 14px}
@media (max-width:560px){.dth,.dtr{grid-template-columns:72px 52px 1fr}.dth>:last-child,.dtr .rk{display:none}}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-family:var(--cond);font-weight:600;font-size:15px;color:var(--muted);position:sticky;top:0;background:var(--panel);z-index:1}
th.l,td.l{text-align:left}
tbody tr:hover{background:var(--panel2)}
.tw{overflow:auto;max-height:640px}
.ov{color:var(--over);font-weight:600}.un{color:var(--under);font-weight:600}
.lg{object-fit:contain;flex:none;display:inline-block;vertical-align:middle}
.out .nm,.outname{color:var(--under)}
.pill.red{background:rgba(224,82,74,.2);color:var(--under)}
.av.isout{box-shadow:0 0 0 2px var(--under)!important}
.faces .av.isout{box-shadow:0 0 0 2px var(--under)}
.alert{display:flex;gap:8px;align-items:center;margin-top:10px;padding:10px 14px;border:1px solid rgba(224,82,74,.5);background:rgba(224,82,74,.12);border-radius:10px;color:var(--under);font-weight:600}
tr.dnprow td{color:var(--under);background:rgba(224,82,74,.06)}
.av .tb.lgb{background:var(--rail);padding:1px;border-radius:50%;line-height:0}
.av .tb img.lg{border-radius:0;object-fit:contain}
.pill{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:999px;background:var(--panel3);color:var(--muted);margin-left:6px}
.link{background:none;border:0;padding:0;font-weight:600;text-align:left;display:inline-flex;align-items:center;gap:10px}
.link:hover .nm{text-decoration:underline}
/* games */
h1{font-family:var(--cond);font-size:38px;margin:6px 0 2px;font-weight:700}
.muted{color:var(--muted)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:12px 0 4px}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:12px}
.game{text-align:left;padding:14px 16px;display:grid;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:10px}
.game:hover{border-color:var(--silver)}
.tm{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px}
.tm small{color:var(--muted);font-weight:500;margin-left:auto}
.faces{display:flex}
.faces .av{margin-left:-8px;box-shadow:0 0 0 2px var(--panel)}
.faces .av:first-child{margin-left:0}
.sw{width:8px;height:26px;border-radius:3px;flex:none}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media (max-width:1000px){.mgrid{grid-template-columns:1fr}}
.mhead{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.mhead h2{font-family:var(--cond);font-size:22px;margin:0}
.navtabs{display:flex;gap:4px;margin-left:8px}
.navtabs button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:600;color:var(--muted)}
.navtabs button[aria-current="true"]{background:var(--panel2);color:var(--ink)}
.asof{color:var(--dim);font-size:13px;white-space:nowrap}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .rail .menu{height:auto!important;width:auto!important;padding:0 14px;border:0;flex:none}
  .gs{display:none}
  .hstats b{font-size:22px}
  .rail .lbl{display:none}
  .rail button.rp{width:auto;padding:8px 10px;border:0}
  .main{padding:10px 10px 50px}
  .hstats{width:100%;margin-left:0}.hstats div{flex:1;min-width:0;border-left:0;border-top:1px solid var(--line)}
  .search{width:100%}
  .linebox{margin-left:0}
}
/* ---- polish ---- */
.panel,.topbar,.game{background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0)) ,var(--panel);box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px rgba(0,0,0,.25)}
.panel,.topbar{border-radius:14px}
.pname{letter-spacing:.2px}
.brandmark{font-family:var(--cond);font-weight:700;font-size:26px;letter-spacing:.3px;color:var(--ink);display:flex;align-items:center;gap:8px}
.brandmark i{width:10px;height:10px;border-radius:50%;background:var(--sky);box-shadow:0 0 12px var(--sky)}
.rail .menu{color:var(--sky)!important}
.navtabs button[aria-current="true"]{background:var(--skybg);color:var(--sky)}
.chip[aria-pressed="true"]{background:var(--skybg);border-color:var(--sky);color:var(--sky2)}
.chip{transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--sky)}
.game{transition:border-color .15s,transform .15s}
.game:hover{border-color:var(--sky);transform:translateY(-2px)}
.ptabs button[aria-selected="true"]{border-bottom-color:var(--sky)}
.rtabs button[aria-selected="true"]{color:var(--sky);border-bottom-color:var(--sky)}
.hstats b{color:var(--sky)}
.ppos{color:var(--sky)}

.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(24,26,29,.96) 0%,rgba(24,26,29,.75) 45%,rgba(24,26,29,0) 80%)}
.hero>*{position:relative}
.hero h1{color:var(--sky);font-size:52px;line-height:1;margin:0 0 8px;text-shadow:0 0 30px rgba(91,192,248,.25)}
.hero p{color:var(--silver);margin:0 0 18px;max-width:46ch}
.hero .chips{padding:0}
.hero .chip{background:rgba(32,33,36,.7);backdrop-filter:blur(6px)}

.tile{position:relative;overflow:visible;transition:transform .15s}
.tile .b{position:relative;overflow:hidden}
.tile .b::after{content:"";position:absolute;inset:0;background:var(--sky);opacity:0;transition:opacity .15s;border-radius:inherit}
.tile:hover .b::after,.tile:focus-visible .b::after{opacity:.28}
.tile:hover{transform:translateY(-2px)}
.tile:hover .h{color:var(--sky)}
.tile[aria-pressed="true"]{border-color:var(--sky);box-shadow:0 0 0 3px var(--skybg)}
.ptabs button:hover{color:var(--ink)}
.ptabs button:hover .badge{filter:brightness(1.2)}
svg rect[data-bar]{transition:opacity .12s}
svg:hover rect[data-bar]{opacity:.55}
svg rect[data-bar]:hover{opacity:1}
/* tooltip */
#tip{position:fixed;z-index:50;pointer-events:none;max-width:260px;background:#121417;border:1px solid var(--sky);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.5);opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s}
#tip.on{opacity:1;transform:none}

#tip .n{color:var(--silver)}

<body>
<div class="shell">
  <aside class="rail" id="rail" aria-label="Recent players"></aside>
  <div class="main">
    <div class="topbar" id="topbar"></div>
    <div id="view"></div>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<script id="data" type="application/json">__DATA__</script>
<script id="photos" type="application/json">__PHOTOS__</script>
<script id="logos" type="application/json">__LOGOS__</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
let PHOTOS={},LOGOS={};try{PHOTOS=JSON.parse(document.getElementById('photos').textContent)}catch(e){}try{LOGOS=JSON.parse(document.getElementById('logos').textContent)}catch(e){}
const REMOTE=__REMOTE__;
const T=D.teams,P=D.players,G=D.games,R=D.rows;
const CUR=2027,PREV=2026,SEASONS={2027:'2026-27',2026:'2025-26'};
const STATS=[['PTS','Points',r=>r[9]],['REB','Rebounds',r=>r[10]],['AST','Assists',r=>r[11]],['3PM','Threes made',r=>r[15]],['PRA','Pts+Reb+Ast',r=>r[9]+r[10]+r[11]],['P+R','Pts+Reb',r=>r[9]+r[10]],['P+A','Pts+Ast',r=>r[9]+r[11]],['R+A','Reb+Ast',r=>r[10]+r[11]],['STL','Steals',r=>r[12]],['BLK','Blocks',r=>r[13]],['STL+BLK','Stocks',r=>r[12]+r[13]],['TOV','Turnovers',r=>r[14]]];
const SK=STATS.map(s=>s[0]),sf=k=>STATS.find(s=>s[0]===k)[2],sname=k=>STATS.find(s=>s[0]===k)[1];
const posG=p=>{p=(p||'').toUpperCase();return p.includes('C')?'C':p.includes('G')?'G':'F'};
const POSN={G:'Guards',F:'Forwards',C:'Centers',A:'All positions'};
const byP=new Map();R.forEach(r=>{(byP.get(r[1])||byP.set(r[1],[]).get(r[1])).push(r)});
byP.forEach(a=>a.sort((x,y)=>G[x[0]][0]<G[y[0]][0]?-1:G[x[0]][0]>G[y[0]][0]?1:0));
const tA=i=>T[i][0],tN=i=>T[i][1],tS=i=>T[i][2],tC=i=>'#'+T[i][3];
const logo=(t,size=24)=>LOGOS[t]?`<img class="lg" src="${LOGOS[t]}" alt="${esc(T[t][2])}" width="${size}" height="${size}" style="width:${size}px;height:${size}px" loading="lazy" onerror="this.style.visibility='hidden'">`:`<span class="sw" style="background:${tC(t)};height:${size}px"></span>`;
const STATUS=D.status||{},REASONS=D.reasons||[];
const pretty=s=>{s=s.toLowerCase();return s.charAt(0).toUpperCase()+s.slice(1)};
function pstat(i){const x=STATUS[i];if(!x)return null;const r=REASONS[x[1]]||'';const coach=r.includes('COACH');const label=r==='INACTIVE'?'Not playing':coach?"Coach's decision":r==='REST'?'Rest':r.includes('SUSPEND')?'Suspended':'Injury: '+pretty(r.replace('INJURY/ILLNESS - ',''));return{n:x[0],label,coach,short:coach?'DNP':'OUT'}}
const DNP=new Map();(D.dnp||[]).forEach(d=>{(DNP.get(d[1])||DNP.set(d[1],[]).get(d[1])).push(d)});
const dnpLabel=r=>{r=REASONS[r]||'';return r.includes('COACH')?"Coach's decision":r==='DID NOT PLAY'?'Did not play':pretty(r)};
const fmt=(v,d=1)=>v==null||isNaN(v)?'–':v.toFixed(d);
const avg=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:null;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=h=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstChild};
const md=d=>{const [y,m,dd]=d.split('-');return +m+'/'+ +dd+'/'+y.slice(2)};
const dl=d=>new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});

/* ---- defense allowed: season -> team -> pos -> stat -> per game ---- */
const DEF={},RANK={},LG={};
[CUR,PREV].forEach(s=>{
  const tot={},gms={};
  R.forEach(r=>{const g=G[r[0]];if(g[1]!==s||g[2]!==2)return;const o=r[3];
    (gms[o]||(gms[o]=new Set())).add(r[0]);
    const pg=posG(P[r[1]][2]);tot[o]=tot[o]||{A:{},G:{},F:{},C:{}};
    STATS.forEach(([k,,f])=>{const v=f(r);tot[o].A[k]=(tot[o].A[k]||0)+v;tot[o][pg][k]=(tot[o][pg][k]||0)+v});
  });
  DEF[s]={};RANK[s]={};LG[s]={};
  Object.keys(tot).forEach(t=>{DEF[s][t]={};['A','G','F','C'].forEach(p=>{DEF[s][t][p]={};SK.forEach(k=>DEF[s][t][p][k]=(tot[t][p][k]||0)/gms[t].size)})});

    s+=`<rect data-bar="1" x="${x}" y="${y(v)}" width="${bw}" height="${Math.max(2,y(0)-y(v))}" fill="${col}"><title>${md(gm[0])} ${r[4]?'vs':'@'} ${tA(r[3])}: ${v} ${k} in ${r[8]} min</title></rect>`;
    if(showTxt)s+=`<text x="${x+bw/2}" y="${Math.min(y(v)+18,y(0)-4)}" text-anchor="middle" font-size="${bw>34?15:12}" font-weight="700" fill="#fff" font-family="Barlow,sans-serif">${v}</text>`;
    const rk=gm[2]===2&&RANK[gm[1]]&&RANK[gm[1]][pg][k]?RANK[gm[1]][pg][k][r[3]]:null;
    if(rk&&slot>=24)s+=`<text x="${x+bw/2}" y="${y(v)-7}" text-anchor="middle" font-size="${slot>=40?13:10}" font-weight="700" fill="${rkCls(rk)}" font-family="JetBrains Mono,monospace">${slot>=40?'R:':''}${rk}</text>`;
    if(showX){s+=`<text x="${x+bw/2}" y="${H-bot+18}" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="Barlow,sans-serif">${r[4]?'vs':'@'} ${tA(r[3])}</text><text x="${x+bw/2}" y="${H-bot+33}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="Barlow,sans-serif">${md(gm[0])}</text>`}
    else if(slot>=18)s+=`<text x="${x+bw/2}" y="${H-bot+16}" text-anchor="middle" font-size="9" fill="var(--muted)" font-family="Barlow,sans-serif">${tA(r[3])}</text>`;

  s+=`<line x1="${lp}" x2="${W-rp}" y1="${y(L)}" y2="${y(L)}" stroke="#fff" stroke-width="2"/>`;
  s+=`<line x1="${lp}" x2="${W-rp}" y1="${y(a)}" y2="${y(a)}" stroke="var(--avg)" stroke-width="2"/>`;
  const lx=lp+(W-lp-rp)/2;s+=`<rect x="${lx-40}" y="${y(a)-11}" width="80" height="22" rx="5" fill="#1F6E99"/><text x="${lx}" y="${y(a)+5}" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="Barlow,sans-serif">${fmt(a)} AVG</text>`;
  s+='</svg>';box.innerHTML=s;
}
function oppTab(body,i,ng){
  const p=P[i],k=st.stat;
  const opp=st.dOpp!=null?st.dOpp:(st.opp!=='all'?+st.opp:(ng?ng.opp:(p[1]===0?1:0)));
  const pos=st.dPos||posG(p[2]),s=st.dSeason,d=DEF[s][opp];
  if(!d){body.append(el('<div class="empty">No defensive data for this season yet.</div>'));return}
  const comp=Math.round(avg(SK.slice(0,4).map(x=>RANK[s][pos][x][opp])));
  const tier=comp<=10?'SOFT MATCHUP':comp<=20?'AVERAGE MATCHUP':'TOUGH MATCHUP';
  const opts=T.map((t,x)=>x).filter(x=>x!==p[1]).sort((a,b)=>tN(a)<tN(b)?-1:1).map(x=>`<option value="${x}" ${x===opp?'selected':''}>${esc(tN(x))}</option>`).join('');
  const hd=el(`<div class="dhead">${logo(opp,46)}<div><h2>${esc(tS(opp))} defense allowed</h2><span class="mtag">${tier}</span><div class="comp">Composite ${comp}/${NT} <span>· ${esc(POSN[pos])} · ${SEASONS[s]} regular season</span></div></div>
    <div style="margin-left:auto;display:flex;gap:6px;flex-wrap:wrap"><select aria-label="Opponent">${opts}</select><select aria-label="Season"><option value="${CUR}">${SEASONS[CUR]}</option><option value="${PREV}">${SEASONS[PREV]}</option></select></div></div>`);
  const [so,ss]=hd.querySelectorAll('select');ss.value=s;so.onchange=e=>{st.dOpp=+e.target.value;render()};ss.onchange=e=>{st.dSeason=+e.target.value;render()};
  body.append(hd);
  const cr=el('<div class="chiprow"><span class="fl">Position</span></div>');
  ['A','G','F','C'].forEach(x=>{const b=el(`<button class="chip" aria-pressed="${x===pos}">${x==='A'?'All':x}</button>`);b.onclick=()=>{st.dPos=x;render()};cr.append(b)});
  body.append(cr);
  const core=['PTS','REB','AST','3PM','STL','BLK'];
  const rks=core.map(x=>[x,RANK[s][pos][x][opp]]).sort((a,b)=>a[1]-b[1]);
  const weak=rks[0],strong=rks[rks.length-1],me=RANK[s][pos][k][opp];
  const card=(c,lab,key,r)=>`<div class="card ${c}"><div class="k">${lab}</div><div class="v">${esc(sname(key))} <em>${fmt(DEF[s][opp][pos][key])}</em></div><div class="s">Rank ${r} of ${NT} in what they allow to ${esc(POSN[pos].toLowerCase())}</div></div>`;
  body.append(el(`<div class="cards">${card('','WEAKEST SPOT',weak[0],weak[1])}${card('str','STRONGEST SPOT',strong[0],strong[1])}${card('','THIS PROP',k,me)}</div>`));
  body.append(el(`<div class="legend"><span style="flex:1 1 220px">Bars read from the offense's side: right of centre means this defense gives up more than average.</span><span><i class="dot" style="background:var(--over)"></i>Softest, rank 1–10</span><span><i class="dot" style="background:var(--amber)"></i>Middle 10</span><span><i class="dot" style="background:var(--under)"></i>Toughest, rank 21–30</span></div>`));
  const tbl=el(`<div class="dtable"><div class="dth"><span>STAT</span><span style="text-align:right">PER GAME</span><span style="display:flex;justify-content:space-between"><span>◀ TOUGHER</span><span>SOFTER ▶</span></span><span style="text-align:right">LEAGUE</span></div></div>`);
  SK.forEach(x=>{const val=DEF[s][opp][pos][x],lg=LG[s][pos][x],r=RANK[s][pos][x][opp];
    const dev=Math.max(-1,Math.min(1,(val-lg)/(lg||1)/0.35)),w=Math.abs(dev)*50;
    const bar=dev>=0?`left:50%;width:${w}%`:`left:${50-w}%;width:${w}%`;
    tbl.append(el(`<div class="dtr ${x===k?'sel':''}"><span class="n">${x}</span><span class="val">${fmt(val)}</span><span class="track"><i style="${bar};background:${rkCls(r)}"></i></span><span class="rk">Rank<b style="color:${rkCls(r)}">${r}</b>avg ${fmt(lg)}</span></div>`))});
  body.append(tbl);
}
function splitTab(body,i,f,L){
  const all=byP.get(i),m=new Map();
  all.forEach(r=>{const o=r[3];if(!m.has(o))m.set(o,{o,c:[],p:[]});(G[r[0]][1]===CUR?m.get(o).c:m.get(o).p).push(f(r))});
  const rows=[...m.values()].map(x=>{const v=[...x.p,...x.c];return{...x,v,a:avg(v),h:hr(v,L)}}).sort((a,b)=>b.a-a.a);
  const box=el(`<div><div class="muted" style="margin-bottom:8px">${esc(st.stat)} vs every opponent, both seasons. ${st.under?'Under':'Over'} ${L}. Tap a team to filter the graph.</div><div class="tw"><table><thead><tr><th class="l">Opponent</th><th>GP</th><th>Avg</th><th>${SEASONS[CUR]}</th><th>${SEASONS[PREV]}</th><th>Hit</th><th class="l">Games</th></tr></thead><tbody></tbody></table></div></div>`);
  const tb=box.querySelector('tbody');
  rows.forEach(x=>{const tr=el(`<tr><td class="l"><button class="link">${logo(x.o,22)}<span class="nm">${esc(tS(x.o))}</span></button></td><td>${x.v.length}</td><td><b>${fmt(x.a)}</b></td><td>${fmt(avg(x.c))}</td><td>${fmt(avg(x.p))}</td><td class="${x.h>=.6?'ov':x.h<.4?'un':''}">${Math.round(x.h*100)}%</td><td class="l">${[...x.p,...x.c].map(v=>`<span class="${hit(v,L)?'ov':'un'}">${v}</span>`).join(' ')}</td></tr>`);
    tr.querySelector('button').onclick=()=>{st.opp=String(x.o);st.sample='L20';render()};tb.append(tr)});
  body.append(box);
}
function logTab(body,g){
  const box=el(`<div><div class="muted" style="margin-bottom:8px">${g.length} games in the current graph, newest first.</div><div class="tw"><table><thead><tr><th class="l">Date</th><th class="l">Opp</th><th class="l">Result</th><th>MIN</th><th>PTS</th><th>REB</th><th>AST</th><th>3PM</th><th>STL</th><th>BLK</th><th>FG</th><th>FT</th><th>TOV</th><th>+/-</th></tr></thead><tbody></tbody></table></div></div>`);
  const tb=box.querySelector('tbody');
  const items=g.map(r=>({d:G[r[0]][0],r}));
  if(g.length){const lo=G[g[0][0]][0],pid=g[0][1];(DNP.get(pid)||[]).forEach(x=>{const d0=G[x[0]][0];if(d0>=lo&&(st.venue==='all'||(st.venue==='home')==!!x[3])&&(st.opp==='all'||x[2]==st.opp))items.push({d:d0,x})})}
  items.sort((a,b)=>a.d<b.d?1:-1);
  items.forEach(it=>{if(it.x){const x=it.x;tb.append(el(`<tr class="dnprow"><td class="l">${md(it.d)}</td><td class="l">${x[3]?'vs':'@'} ${tA(x[2])}</td><td class="l" colspan="12">DNP · ${esc(dnpLabel(x[4]))}</td></tr>`));return}
    const r=it.r;const gm=G[r[0]],tag=gm[2]===3?'<span class="pill">PO</span>':gm[2]===5?'<span class="pill">PI</span>':'';
    tb.append(el(`<tr><td class="l">${md(gm[0])}</td><td class="l">${r[4]?'vs':'@'} ${tA(r[3])}${tag}</td><td class="l ${r[5]?'ov':'un'}">${r[5]?'W':'L'} ${r[6]}-${r[7]}</td><td>${r[8]}</td><td>${r[9]}</td><td>${r[10]}</td><td>${r[11]}</td><td>${r[15]}-${r[16]}</td><td>${r[12]}</td><td>${r[13]}</td><td>${r[17]}-${r[18]}</td><td>${r[19]}-${r[20]}</td><td>${r[14]}</td><td>${r[21]>0?'+':''}${r[21]}</td></tr>`))});
  body.append(box);
}
const TIP=document.getElementById('tip');
function showTip(e){const t=e.target.closest('[data-tip]');if(!t){TIP.classList.remove('on');return}
  TIP.innerHTML=t.dataset.tip;TIP.classList.add('on');const r=t.getBoundingClientRect(),w=TIP.offsetWidth,h=TIP.offsetHeight;
  let x=r.left+r.width/2-w/2;x=Math.max(8,Math.min(innerWidth-w-8,x));let y=r.top-h-10;if(y<8)y=r.bottom+10;TIP.style.left=x+'px';TIP.style.top=y+'px'}
document.addEventListener('mouseover',showTip);document.addEventListener('focusin',showTip);
document.addEventListener('mouseout',e=>{if(e.target.closest('[data-tip]')&&!e.relatedTarget?.closest?.('[data-tip]'))TIP.classList.remove('on')});
document.addEventListener('scroll',()=>TIP.classList.remove('on'),true);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(st.view==='player')render()},200)});
render();
</script>
